# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: thought-firewall-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ENABLE_DOCS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: thought-firewall-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: openai/gpt-4o-mini
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: thought-firewall-db
    plan: starter
    databaseName: thoughtfirewall
    user: thoughtfirewall
